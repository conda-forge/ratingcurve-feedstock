{% set name = "ratingcurve" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/ratingcurve-{{ version }}.tar.gz
  sha256: d9047ec6951ac5ee1b6adbfad758f4f207625e54836f94195508631ed8beabc8

build:
  noarch: python
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools_scm
  run:
    - python >={{ python_min }}
    - arviz
    - matplotlib-base
    - netcdf4
    - numpy
    - pandas
    - patsy
    # 5.28.1 is the first release to cap arviz <1.0; earlier releases resolve
    # to arviz 1.x, which pymc 5 cannot import
    - pymc >=5.28.1
    - pytensor
    - xarray

test:
  imports:
    - ratingcurve
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/ratingcurve/
  summary: A library for fitting multi-segment stage-discharge rating curves.
  license: CC0-1.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - thodson-usgs
